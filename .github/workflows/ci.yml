name: AI Resume ATS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m compileall app

      - name: Build Docker image
        run: |
          docker build -t daniyaalabbas/ai-resume-ats:${{ github.sha }} .
          docker tag daniyaalabbas/ai-resume-ats:${{ github.sha }} \
            daniyaalabbas/ai-resume-ats:latest

      - name: Verify Docker image
        run: |
          docker image inspect daniyaalabbas/ai-resume-ats:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push daniyaalabbas/ai-resume-ats:${{ github.sha }}
          docker push daniyaalabbas/ai-resume-ats:latest
