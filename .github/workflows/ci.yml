name: AI Resume ATS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/deployment.yaml'

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m compileall app

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t daniyaalabbas/ai-resume-ats:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker image inspect daniyaalabbas/ai-resume-ats:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push daniyaalabbas/ai-resume-ats:${{ github.sha }}

      - name: Update Kubernetes image
        run: |
          sed -i "s|image: daniyaalabbas/ai-resume-ats:.*|image: daniyaalabbas/ai-resume-ats:${{ github.sha }}|" k8s/deployment.yaml

      - name: Commit Kubernetes manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes"
          else
            git commit -m "deploy image ${{ github.sha }}"
            git push
          fi
