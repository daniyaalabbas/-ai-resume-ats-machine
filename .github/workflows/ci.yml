name: AI Resume ATS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  infra-check:
    name: Cluster Node Health (Ansible)
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible on Runner (if missing)
        run: |
          which ansible-playbook || (sudo apt-get update && sudo apt-get install -y ansible)

      - name: Syntax Check Playbook
        run: |
          ansible-playbook -i ansible/inventory ansible/node-check.yml --syntax-check

      - name: Execute Node Health Check
        run: |
          ansible-playbook -i ansible/inventory ansible/node-check.yml

  test-and-build:
    name: Build and Push ATS App
    needs: infra-check
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m compileall app

      - name: Build Docker image
        run: |
          docker build -t daniyaalabbas/ai-resume-ats:${{ github.sha }} .
          docker tag daniyaalabbas/ai-resume-ats:${{ github.sha }} daniyaalabbas/ai-resume-ats:latest

      - name: Verify Docker image
        run: |
          docker image inspect daniyaalabbas/ai-resume-ats:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push daniyaalabbas/ai-resume-ats:${{ github.sha }}
          docker push daniyaalabbas/ai-resume-ats:latest

