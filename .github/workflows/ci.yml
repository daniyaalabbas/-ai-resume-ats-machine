
name: AI Resume ATS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python files
        run: |
          python -m compileall app
      - name: Build Docker image
        run: |
          docker build -t daniyaalabbas/ai-resume-ats:${{ github.sha }} .
          docker tag daniyaalabbas/ai-resume-ats:${{ github.sha }} \
            daniyaalabbas/ai-resume-ats:latest
      - name: Verify Docker image
        run: |
          docker image inspect daniyaalabbas/ai-resume-ats:${{ github.sha }}
      - name: Push Docker image
        run: |
          docker push daniyaalabbas/ai-resume-ats:${{ github.sha }}
          docker push daniyaalabbas/ai-resume-ats:latest
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/ai-resume-ats \
            ai-resume-ats=daniyaalabbas/ai-resume-ats:${{ github.sha }}
      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status deployment/ai-resume-ats --timeout=180s
      - name: Verify Kubernetes deployment
        run: |
          kubectl get deployment ai-resume-ats
          kubectl get pods -l app=ai-resume-ats
      - name: Kubernetes health check
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=ai-resume-ats \
            --timeout=120s
          POD=$(kubectl get pods \
            -l app=ai-resume-ats \
            --field-selector=status.phase=Running \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1].metadata.name}')
          echo "Testing pod: $POD"
          kubectl exec "$POD" -- \
            python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:5000/health').read().decode())"
