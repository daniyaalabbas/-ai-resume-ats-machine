# 1. Headless Service for Stable DNS Names
apiVersion: v1
kind: Service
metadata:
  name: ai-resume-ats-headless
  labels:
    app: ai-resume-ats-stateful
spec:
  clusterIP: None
  selector:
    app: ai-resume-ats-stateful
  ports:
  - port: 5000
    name: http
    targetPort: 5000
---
# 2. StatefulSet for AI Resume ATS
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-resume-ats-stateful
spec:
  serviceName: "ai-resume-ats-headless"
  replicas: 2
  selector:
    matchLabels:
      app: ai-resume-ats-stateful

  template:
    metadata:
      labels:
        app: ai-resume-ats-stateful

    spec:
      # Pre-flight check before main app starts
      initContainers:
      - name: init-storage-check
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          echo "Initializing persistent storage..."
          mkdir -p /app/data/resumes
          echo "Storage ready."
        volumeMounts:
        - name: resume-storage
          mountPath: /app/data

      containers:
      - name: ai-resume-ats
        image: daniyaalabbas/ai-resume-ats:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000
          name: http

        # Load environment variables from your ConfigMap
        envFrom:
        - configMapRef:
            name: ai-resume-config

        # Mount persistent disk inside container
        volumeMounts:
        - name: resume-storage
          mountPath: /app/data

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20

  # Automatic PVC creation for each replica (pod-0, pod-1)
  volumeClaimTemplates:
  - metadata:
      name: resume-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 256Mi
