apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-resume-ats
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/daniyaalabbas/-ai-resume-ats-machine.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
