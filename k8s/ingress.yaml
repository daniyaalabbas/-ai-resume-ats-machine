apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-resume-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: ai-resume.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-resume-ats-service
            port:
              number: 5000
