apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: web-stateful

spec:
  serviceName: web-stateful
  replicas: 2

  selector:
    matchLabels:
      app: web-stateful

  template:
    metadata:
      labels:
        app: web-stateful

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        ports:
        - containerPort: 80
